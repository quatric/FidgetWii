name: Build

on:
  push:
    tags-ignore: [latest]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates
      - name: Install host tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
      - name: Build controller libraries
        run: ./scripts/build_controller_portlibs.sh
      - name: Build all-controller DOL
        run: make WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1
      - name: Package
        run: cp FidgetWii-xz.dol apps/FidgetWii/boot.dol
      - uses: actions/upload-artifact@v4
        with:
          name: FidgetWii
          path: apps/
      - name: Zip the release
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd . && zip -r "$GITHUB_WORKSPACE/FidgetWii.zip" apps)
      - uses: actions/upload-artifact@v4
        with:
          name: release-FidgetWii
          if-no-files-found: error
          path: |
            FidgetWii.zip

  wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U libraries
        run: dkp-pacman -Sy --noconfirm wiiu-dev wiiu-sdl2
      - name: Build
        run: make -f Makefile.wiiu
      - uses: actions/upload-artifact@v4
        with:
          name: release-FidgetWii-wiiu
          if-no-files-found: error
          path: FidgetWiiU.wuhb

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch libraries
        run: dkp-pacman -Sy --noconfirm switch-dev switch-sdl2
      - name: Build
        run: make -f Makefile.switch
      - uses: actions/upload-artifact@v4
        with:
          name: release-FidgetWii-switch
          if-no-files-found: error
          path: FidgetSwitch.nro

  n3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS libraries
        run: dkp-pacman -Sy --noconfirm 3ds-dev
      - name: Build
        run: make -f Makefile.3ds
      - uses: actions/upload-artifact@v4
        with:
          name: release-FidgetWii-3ds
          if-no-files-found: error
          path: Fidget3DS.3dsx

  nds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DS libraries
        run: dkp-pacman -Sy --noconfirm nds-dev
      - name: Build
        run: make -f Makefile.nds
      - uses: actions/upload-artifact@v4
        with:
          name: release-FidgetWii-nds
          if-no-files-found: error
          path: FidgetDS.nds

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: [build, wiiu, switch, n3ds, nds]
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FidgetWii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of FidgetWii from ${{ github.sha }}.

            Wii: extract FidgetWii.zip to the root of your SD card (or USB drive) and open FidgetWii from the Homebrew Channel.
            Wii U: copy FidgetWiiU.wuhb to wiiu/apps/ on the SD card.
            Switch: copy FidgetSwitch.nro to switch/ on the SD card.
            3DS: copy Fidget3DS.3dsx to 3ds/ on the SD card.
            DS: run FidgetDS.nds from your flashcard.
          files: |
            out/FidgetWii.zip
            out/FidgetWiiU.wuhb
            out/FidgetSwitch.nro
            out/Fidget3DS.3dsx
            out/FidgetDS.nds
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FidgetWii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Wii: extract FidgetWii.zip to the root of your SD card (or USB drive) and open FidgetWii from the Homebrew Channel.
            Wii U: copy FidgetWiiU.wuhb to wiiu/apps/ on the SD card.
            Switch: copy FidgetSwitch.nro to switch/ on the SD card.
            3DS: copy Fidget3DS.3dsx to 3ds/ on the SD card.
            DS: run FidgetDS.nds from your flashcard.
          files: |
            out/FidgetWii.zip
            out/FidgetWiiU.wuhb
            out/FidgetSwitch.nro
            out/Fidget3DS.3dsx
            out/FidgetDS.nds
